<!-- Audio context for sound effects -->
<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playClickSound() {
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
        oscillator.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.1);
        gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.1);
    }

    function playTadaSound() {
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        notes.forEach((freq, index) => {
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = 'triangle';
            oscillator.frequency.setValueAtTime(freq, audioCtx.currentTime + (index * 0.1));
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime + (index * 0.1));
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + (index * 0.1) + 0.4);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start(audioCtx.currentTime + (index * 0.1));
            oscillator.stop(audioCtx.currentTime + (index * 0.1) + 0.4);
        });
    }

    let selectedAvatarUrl = 'https://lh3.googleusercontent.com/aida-public/AB6AXuCiDr8Z405ErbLPTnrddcjLO5A4q8vc7yaMW7i07nLSS-T94mzlg_voKPP5iGRHlOLPe7koM5KeMZ3-fDRCT0j3Pb7zSZ3nDvQGdQExhxQm2FIzZQfw2EkQsfa6zOpbHlHmX1eOBtKHjJpECmhpFiYUHQMR_xFJNQtKw-JIItOd75SMoOjdBguY038e0qQind5AppSH_j_uEMBR1ItfOdfCjyH2ZRL7Ykyw8j8IVPkp9XWRV7NRSHaKa9PF3UH-dEf2-WbJ67Lo6A'; 

    function selectAvatar(element, url) {
        playClickSound();
        // Remove selection class from all cards
        document.querySelectorAll('.avatar-card').forEach(card => {
            card.classList.remove('avatar-selected');
        });
        // Add to clicked card
        element.classList.add('avatar-selected');
        selectedAvatarUrl = url;
    }

    function saveAndStart() {
        const nameInput = document.getElementById('explorer-name');
        const explorerName = nameInput.value.trim();
        
        if (!explorerName) {
            alert('Please enter your name to start the adventure!');
            nameInput.focus();
            return;
        }

        if (!selectedAvatarUrl) {
            alert('Please choose an explorer companion!');
            return;
        }

        // Play success sound
        playTadaSound();

        // Create profile object
        const profile = {
            name: explorerName,
            avatar: selectedAvatarUrl,
            level: 1,
            xp: 0,
            stars: 125,
            unlockedLevels: [1],
            registrationDate: new Date().toISOString()
        };

        // Save to localStorage
        localStorage.setItem('explorer_profile', JSON.stringify(profile));
        // Backward compatibility for existing references
        localStorage.setItem('explorer_name', explorerName);
        localStorage.setItem('explorer_avatar', selectedAvatarUrl);
        
        // Brief delay for the sound to be heard before redirecting
        setTimeout(() => {
            window.location.href = '{{DATA:SCREEN:SCREEN_52}}';
        }, 500);
    }

    // Restore name if it exists (for edits)
    window.addEventListener('load', () => {
        const savedName = localStorage.getItem('explorer_name');
        if (savedName) {
            document.getElementById('explorer-name').value = savedName;
        }
    });
</script>
</body></html>
