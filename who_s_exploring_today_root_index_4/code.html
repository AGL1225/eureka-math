<script>
document.addEventListener('DOMContentLoaded', () => {
  // Profile Selection Logic
  const profileCards = document.querySelectorAll('.profile-card[data-profile-id]');
  profileCards.forEach(card => {
    card.addEventListener('click', () => {
      const name = card.querySelector('h3').textContent;
      const avatar = card.querySelector('img').src;
      const level = card.querySelector('.level-badge').textContent.trim();
      
      // Save to localStorage
      localStorage.setItem('selectedExplorer', JSON.stringify({ 
        name, 
        avatar, 
        level,
        id: card.dataset.profileId 
      }));
      
      // Navigate to Home Screen
      window.location.href = '{{DATA:SCREEN:SCREEN_47}}';
    });
  });

  // Add New Explorer Logic
  const addCard = document.querySelector('.add-explorer-card');
  if (addCard) {
    addCard.addEventListener('click', () => {
      window.location.href = '{{DATA:SCREEN:SCREEN_6}}';
    });
  }
});
</script>
