<script>
        /**
         * Select profile and navigate to Nexus Hub
         * @param {string} id - The local ID
         * @param {string} name - Profile name
         * @param {string} level - Current level
         * @param {string} avatarClass - CSS class for the avatar sprite position
         */
        function handleSelect(id, name, level, avatarClass) {
            // Store selected session info
            localStorage.setItem('explorer_id', id);
            localStorage.setItem('explorer_name', name);
            localStorage.setItem('explorer_level', level);
            localStorage.setItem('explorer_avatar_class', avatarClass);
            
            // Standard avatar source for UI elements that might use <img> tags
            localStorage.setItem('explorer_avatar', 'https://lh3.googleusercontent.com/aida/ADBb0uhr1nPXeHiRMYvCjA_FXUcvf307hLr1onsr2hZ0Fu9d7vRp95nb5J5665jORO-KqNDYFiXG7qW-o56Aa1EQX1Us1NMHD7PiIip78SxJuZ38dLMFwHE7usYT-mPCE3VKTXFrsQOfb8DnhrF7ht-mxHeFD5xQNl7OvNWYBNj7sqU8YX2AsanLGzsPLiLHtlH7He8sRsOgW41UHARxiBVZQOoc3TvtjJbCFveIb_joYAEX6jXPdzhcs-Yk');

            // Visual feedback
            const btn = event.currentTarget;
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="flex items-center justify-center gap-2">Connecting...</span>';
            btn.classList.add('animate-pulse');
            btn.disabled = true;

            // Redirect to Nexus Hub
            setTimeout(() => {
                window.location.href = '{{DATA:SCREEN:SCREEN_50}}';
            }, 400);
        }

        // Handle PWA and environment check
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Eureka Math World Initialized');
        });
    </script>
