<div class="absolute inset-0 bg-white/40 backdrop-blur-sm z-0"></div>
<div class="relative z-10 w-full max-w-4xl px-margin-mobile flex flex-col items-center">

<div class="bg-white rounded-lg p-md empire-shadow mb-lg text-center border-2 border-primary-container max-w-md">
<h2 class="font-headline-md text-headline-md text-primary mb-xs">Brew a Potion!</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Objective: Brew a potion with <span class="font-bold text-primary">54 HP</span></p>
</div>
<!-- Beaker Section -->
<div class="relative w-64 h-80 flex flex-col items-center justify-end">
<!-- Digital Counter -->
<div class="absolute -top-12 bg-on-surface text-surface px-md py-xs rounded-full font-display-lg-mobile text-display-lg-mobile empire-shadow-red z-20">
                    54 <span class="text-label-caps font-label-caps">HP</span>
</div>
<!-- Glass Beaker -->
<div class="glass-beaker w-full h-full rounded-b-xl rounded-t-sm relative overflow-hidden flex flex-col justify-end">

<div class="potion-liquid w-full h-[65%] relative">
<div class="absolute top-0 left-0 w-full h-4 bg-white/20 blur-sm"></div>

<div class="absolute bottom-4 left-1/4 w-4 h-4 bg-white/40 rounded-full"></div>
<div class="absolute bottom-12 right-1/3 w-2 h-2 bg-white/40 rounded-full"></div>
</div>
</div>

<div class="absolute inset-y-0 right-4 flex flex-col justify-between py-md pointer-events-none opacity-50">

<div class="w-4 h-0.5 bg-on-surface"></div>
<div class="w-4 h-0.5 bg-on-surface"></div>

<div class="w-16 h-16 bg-error rounded-full flex items-center justify-center shadow-lg group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-white text-4xl" data-weight="fill">water_drop</span>
</div>
<div class="text-left">
<span class="font-headline-md text-headline-md text-error block">Red Drop</span>
<span class="font-label-caps text-label-caps text-on-surface-variant">Value: 10</span>
</div>
</button>
<!-- Blue Drop (Ones) -->
<button class="bg-surface-container-highest rounded-lg p-md flex items-center gap-md empire-shadow active:scale-95 transition-transform group">
<div class="w-16 h-16 bg-primary rounded-full flex items-center justify-center shadow-lg group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-white text-4xl" data-weight="fill">water_drop</span>
</div>
<div class="text-left">
<span class="font-headline-md text-headline-md text-primary block">Blue Drop</span>
<span class="font-label-caps text-label-caps text-on-surface-variant">Value: 1</span>
</div>
</button>
</div>
