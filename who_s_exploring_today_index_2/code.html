<script>
        function handleSelect(profileId) {
            const name = document.getElementById(`name-${profileId}`).textContent;
            const avatar = document.getElementById(`avatar-${profileId}`).src;
            const level = document.getElementById(`level-${profileId}`).textContent;

            // Save to localStorage for use in Nexus Hub
            localStorage.setItem('explorer_name', name);
            localStorage.setItem('explorer_avatar', avatar);
            localStorage.setItem('explorer_level', level);

            // Visual feedback before redirect
            const btn = event.currentTarget;
            btn.innerHTML = 'Joining...';
            btn.classList.add('animate-pulse');

            // Redirect to Nexus Hub
            setTimeout(() => {
                window.location.href = '{{DATA:SCREEN:SCREEN_47}}';
            }, 300);
        }

        // Initialize view
        document.addEventListener('DOMContentLoaded', () => {
            // Check if there's a saved session to pre-highlight? (Optional UX enhancement)
        });
